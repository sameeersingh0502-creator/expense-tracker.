<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <!-- One font family: Manrope (falls back to system font if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <header class="top">
      <p class="label">Balance</p>
      <h1 id="balance" class="balance">₹0.00</h1>

      <dl class="totals">
        <div>
          <dt>Income</dt>
          <dd id="income" class="in">₹0.00</dd>
        </div>
        <div>
          <dt>Spent</dt>
          <dd id="expense">₹0.00</dd>
        </div>
      </dl>
    </header>

    <!-- Add transaction -->
    <form id="transaction-form" class="add">
      <input type="text" id="description" placeholder="What was it for?" aria-label="Description" required>
      <input type="number" id="amount" placeholder="Amount (₹)" aria-label="Amount" min="1" step="0.01" required>

      <select id="type" aria-label="Type">
        <option value="expense" selected>Expense</option>
        <option value="income">Income</option>
      </select>

      <select id="category" aria-label="Category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Salary</option>
        <option>Other</option>
      </select>

      <input type="date" id="date" aria-label="Date" required>
      <button type="submit" class="primary">Add</button>
    </form>

    <!-- Transactions -->
    <section class="history">
      <div class="history-head">
        <h2>Transactions</h2>
        <select id="filter" aria-label="Show">
          <option value="all">Show all</option>
          <option value="income">Income only</option>
          <option value="expense">Expenses only</option>
        </select>
      </div>

      <ul id="list"></ul>
      <p id="empty-msg">Nothing here yet. Add your first transaction above.</p>

      <button id="clear-btn" class="quiet" type="button">Clear all transactions</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
